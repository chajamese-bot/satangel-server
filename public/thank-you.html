<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're in — SAT Angel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --navy-deep:#0B1229; --card:#182352; --gold:#E7B85C; --gold-soft:#F4D999; --paper:#F3F5FB; --paper-dim:#A9B2D4; --line:rgba(243,245,251,0.12); }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--navy-deep); color:var(--paper); font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;}
  .card{max-width:480px;}
  .mark{margin-bottom:24px;}
  h1{font-family:'Fraunces',serif; font-size:2.1rem; margin-bottom:14px;}
  p{color:var(--paper-dim); font-size:1rem; line-height:1.6; margin-bottom:28px;}
  .btn{display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,var(--gold),#F0A202); color:#2A1B00; font-weight:700; padding:14px 28px; border-radius:10px; text-decoration:none; font-size:0.95rem;}
  .fine{margin-top:26px; font-size:0.82rem; color:var(--paper-dim);}
  .fine a{color:var(--gold-soft); text-decoration:none;}
</style>
<link rel="stylesheet" href="transitions.css">
<noscript><style>body{opacity:1 !important; transform:none !important;}</style></noscript>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="40" height="40" viewBox="0 0 26 26" fill="none"><path d="M13 1 L15.2 10.8 L25 13 L15.2 15.2 L13 25 L10.8 15.2 L1 13 L10.8 10.8 Z" fill="#E7B85C"/></svg>
    </div>
    <h1>You're in.</h1>
    <p>Thanks for joining SAT Angel — your payment went through and your access is being set up. Check your email for a confirmation and next steps.</p>
    <a href="index.html" class="btn">Back to SAT Angel →</a>
  </div>
<script src="transitions.js"></script>
</body>
</html>
